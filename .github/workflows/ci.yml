name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: build-and-lint
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # Build the app and run the unit tests (no signing needed — no cert yet).
      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Colophon/Colophon.xcodeproj \
            -scheme Colophon \
            -destination 'platform=macOS' \
            -only-testing:ColophonTests \
            CODE_SIGNING_ALLOWED=NO

      # swift-format ships with the toolchain — no extra dependency.
      - name: Format lint
        run: |
          xcrun swift-format lint --strict --recursive \
            --configuration .swift-format \
            Colophon/Colophon Colophon/ColophonTests Colophon/ColophonUITests
